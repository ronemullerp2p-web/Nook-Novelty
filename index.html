    <div class="pm">
      <button class="pm-close" type="button" aria-label="Close">✕</button>
      <div class="pm-body" id="pmBody"></div>
    </div>
  </div>
  <aside class="drawer" id="cart">
    <div class="head"><strong id="drawerTitle">Your cart</strong></div>
    <div class="content">
      <div id="cartView">
        <div id="cartLines"></div>
        <form id="checkout" class="hidden">
          <h3>Checkout</h3>
          <div class="co-acc" id="coAcc"></div>
          <label>Full name *</label><input name="name" required />
          <label>Email *</label><input name="email" type="email" required />
          <label>Phone</label><input name="phone" type="tel" />
          <label>Delivery address</label><textarea name="address" rows="3"></textarea>
        </form>
      </div>
      <div id="doneView" class="hidden"></div>
    </div>
    <div class="foot" id="cartFoot">
      <div id="cartSums">
        <div class="line sum-sub hidden" style="border:0;padding:2px 0"><span class="muted">Subtotal</span><span id="cartSub">R0.00</span></div>
        <div class="line sum-ship hidden" style="border:0;padding:2px 0"><span class="muted">Shipping</span><span id="cartShip">R0.00</span></div>
        <div class="muted ship-note hidden" id="shipNote" style="font-size:12px;margin:2px 0 4px"></div>
        <div class="line" style="border:0"><strong>Total</strong><strong id="cartTotal">R0.00</strong></div>
      </div>
      <button class="btn primary" id="checkoutBtn" style="width:100%">Checkout</button>
      <button class="btn" id="closeCart" style="width:100%;margin-top:8px">Continue shopping</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const cfg = window.SHOP_CONFIG;
    // two connections: "db" is the anonymous shop (products, prices — never logged in);
    // "acct" is the customer's own account (sign in, orders, wishlist). Kept apart from the admin's login.
    const db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY,
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "nn-shop-anon" } });
    const acct = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY,
      { auth: { storageKey: "nn-shop-customer", detectSessionInUrl: true } });
    const money = n => new Intl.NumberFormat(cfg.LOCALE, { style: "currency", currency: cfg.CURRENCY }).format(n);
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

    let products = [];
    let categories = [];
    let settings = {};
    let activeCat = "";
    let cart = loadCart();

    function loadCart() { try { return JSON.parse(localStorage.getItem("cart") || "{}"); } catch { return {}; } }
    function storeCart() { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch {} }
    function saveCart() { storeCart(); renderCart(); }
    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2500);
    }

    // ---------- BUSINESS DETAILS ----------
    async function loadSettings() {
      const { data } = await db.from("settings").select("data").eq("id", 1).maybeSingle();
      settings = data?.data || {};
      if (products.length) renderCart();   // shipping fee may have arrived after the products
      const name = settings.business_name || cfg.SHOP_NAME || "Shop";
      document.title = settings.tagline ? `${name} — ${settings.tagline}` : name;
      $("shopName").textContent = name;
      $("tagline").textContent = settings.tagline || "";
      $("tagline").classList.toggle("hidden", !settings.tagline);
      // big logo on the left: the one uploaded in Business Details, otherwise logo.jpg
      if (settings.logo_url) { $("sideLogo").src = settings.logo_url; $("sideLogoWrap").classList.remove("hidden"); }
      $("sideLogo").alt = name;

      const wa = (settings.whatsapp || "").replace(/\D/g, "").replace(/^0/, "27");
      const bits = [
        settings.email && `<span>✉ <a href="mailto:${esc(settings.email)}">${esc(settings.email)}</a></span>`,
        settings.phone && `<span>☎ <a href="tel:${esc(settings.phone)}">${esc(settings.phone)}</a></span>`,
        wa && `<span>WhatsApp: <a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(settings.whatsapp)}</a></span>`,
        settings.website && `<span><a href="${esc(settings.website)}" target="_blank" rel="noopener">${esc(settings.website.replace(/^https?:\/\//, ""))}</a></span>`,
        settings.address && `<span>${esc(settings.address).replace(/\n/g, ", ")}</span>`,
        settings.reg_no && `<span>Reg: ${esc(settings.reg_no)}</span>`,
        settings.vat_no && `<span>VAT: ${esc(settings.vat_no)}</span>`,
      ].filter(Boolean);
      bits.push(`<span>© ${new Date().getFullYear()} ${esc(name)}</span>`);
      $("footerInner").innerHTML = bits.join("");
      $("footer").classList.remove("hidden");
    }

    // ---------- CATEGORIES & PRODUCTS ----------
    let colors = [], variants = [];
    const sel = {};   // chosen colour/size per product: { [productId]: { color, size } }
    const parseSizes = t => [...new Set(String(t || "").split(/[,;]+/).flatMap(x => {
      x = x.trim();
      const r = x.match(/^(\d{1,2})\s*(?:-|–|to)\s*(\d{1,2})$/i);   // "3-9" or "3 to 9" -> 3, 4, 5 … 9
      if (r && +r[2] > +r[1] && +r[2] - +r[1] <= 30) return Array.from({ length: +r[2] - +r[1] + 1 }, (_, i) => String(+r[1] + i));
      return x ? [x] : [];
    }))];
    async function loadCatalog() {
      const [cats, prods, cols, vars] = await Promise.all([
        db.from("categories").select("id,name,parent_id").eq("active", true).order("sort_order").order("name"),
        db.from("products").select("id,name,description,full_description,price,stock,category_id,image_url,sizes,discount_pct,discount_start,discount_end")
          .eq("active", true).order("created_at", { ascending: false }),
        db.from("product_colors").select("id,product_id,name,image_url,price,sort_order,on_sale").order("sort_order"),
        db.from("product_variants").select("id,product_id,color_id,size,stock"),
      ]);
      // older databases miss newer columns (update-18: full_description, update-13: sizes): try without them
      for (const cols of ["id,name,description,full_description,price,stock,category_id,image_url,sizes", "id,name,description,price,stock,category_id,image_url,sizes", "id,name,description,price,stock,category_id,image_url"]) {
        if (!prods.error) break;
        const retry = await db.from("products").select(cols).eq("active", true).order("created_at", { ascending: false });
        if (!retry.error) { prods.error = null; prods.data = retry.data; }
        else if (cols.indexOf("sizes") < 0) { toast("Could not load products: " + retry.error.message); return; }
      }
      if (cats.error) {   // before update-17 there are no sub-categories yet
        const retry = await db.from("categories").select("id,name").eq("active", true).order("sort_order").order("name");
        cats.data = retry.data;
      }
      // a sub-category whose main category is hidden is hidden too
      const all = cats.data || [], ids = new Set(all.map(c => c.id));
      const shown = c => { let x = c, n = 0; while (x && x.parent_id && n++ < 20) { if (!ids.has(x.parent_id)) return false; x = all.find(y => y.id === x.parent_id); } return true; };
      categories = all.filter(shown);
      products = prods.data;
      if (cols.error) {   // before update-21 there's no on_sale column
        const retry = await db.from("product_colors").select("id,product_id,name,image_url,price,sort_order").order("sort_order");
        cols.error = retry.error; cols.data = retry.data;
      }
      colors = cols.error ? [] : cols.data;
      variants = vars.error ? [] : vars.data;
      for (const key of Object.keys(cart)) if (!lineInfo(key)) delete cart[key];
      storeCart();
      if (activeCat && !categories.some(c => c.id === activeCat)) activeCat = "";
      renderCats(); renderProducts(); renderCart();
      if (openPid) renderDetail();
    }

    // ----- discounts: a % off between a start and end date (checkout works it out the same way) -----
    const todayStr = () => new Date().toLocaleDateString("en-CA");   // yyyy-mm-dd
    // col: a colour — only colours ticked for the sale get the discount
    function discountNow(p, col) {
      if (col && col.on_sale === false) return 0;
      const pct = Number(p.discount_pct) || 0, t = todayStr();
      if (pct <= 0 || (p.discount_start && t < p.discount_start) || (p.discount_end && t > p.discount_end)) return 0;
      return pct;
    }
    const salePrice = (p, price, col) => { const d = discountNow(p, col); return d ? Math.round(Number(price) * (100 - d)) / 100 : Number(price); };
    // is any colour of this product on sale? (or the product itself, when it has no colours)
    function anySale(p) {
      const cs = colors.filter(c => c.product_id === p.id);
      return cs.length ? cs.some(c => discountNow(p, c)) : !!discountNow(p);
    }
    function saleNote(p, col, partial) {
      const d = discountNow(p, col); if (!d) return "";
      const left = p.discount_end ? Math.round((new Date(p.discount_end + "T00:00") - new Date(todayStr() + "T00:00")) / 864e5) : null;
      return `${d}% off` + (partial ? " selected colours" : "") + (left == null ? "" : left === 0 ? " · last day!" : ` · ${left} day${left === 1 ? "" : "s"} left`);
    }
    // price markup: red and bold when on sale, with the % and days left underneath
    function priceHtml(p, price, cls, prefix = "", col) {
      const d = discountNow(p, col);
      if (!d) return `<span class="${cls}">${prefix}${money(price)}</span>`;
      return `<span class="${cls} on-sale">${prefix}${money(salePrice(p, price, col))} <s class="was">${money(price)}</s></span>`;
    }

    // everything about one product's colours and sizes
    function optionsOf(p) {
      const cs = colors.filter(c => c.product_id === p.id);
      const vs = variants.filter(v => v.product_id === p.id);
      const sizes = parseSizes(p.sizes).filter(sz => vs.some(v => v.size === sz));
      return { colors: cs, variants: vs, sizes, has: vs.length > 0 };
    }
    const colorStock = (o, cid) => o.variants.filter(v => v.color_id === cid).reduce((t, v) => t + v.stock, 0);
    function choice(p, o) {
      const c = sel[p.id] || (sel[p.id] = {});
      if (o.colors.length && !o.colors.some(x => x.id === c.color))
        c.color = (o.colors.find(x => colorStock(o, x.id) > 0) || o.colors[0]).id;
      if (o.sizes.length === 1) c.size = o.sizes[0];
      return c;
    }
    function variantFor(p, o, c) {
      if (!o.has) return null;
      return o.variants.find(v => (v.color_id || null) === (o.colors.length ? c.color : null) &&
                                  (v.size || null) === (o.sizes.length ? (c.size || "__none") : null)) || null;
    }
    // cart keys are a product id (no options) or a colour/size id
    function lineInfo(key) {
      const v = variants.find(x => x.id === key);
      if (v) {
        const p = products.find(x => x.id === v.product_id); if (!p) return null;
        const c = colors.find(x => x.id === v.color_id);
        return { product: p, variant: v, name: p.name,
                 sub: [c && c.name, v.size && "Size " + v.size, discountNow(p, c) && discountNow(p, c) + "% off"].filter(Boolean).join(" · "),
                 price: salePrice(p, c && c.price != null ? c.price : p.price, c), stock: v.stock,
                 image: (c && c.image_url) || p.image_url };
      }
      const p = products.find(x => x.id === key);
      if (!p || variants.some(x => x.product_id === p.id)) return null;
      return { product: p, variant: null, name: p.name, sub: discountNow(p) ? discountNow(p) + "% off" : "", price: salePrice(p, p.price), stock: p.stock, image: p.image_url };
    }

    // ----- categories: main row, then a row for each level you open (Women › Footwear › Vellies) -----
    const catKids = pid => categories.filter(c => (c.parent_id || null) === (pid || null));
    function catWithSubs(id) {
      const ids = new Set([id]); let grew = true;
      while (grew) { grew = false; categories.forEach(c => { if (c.parent_id && ids.has(c.parent_id) && !ids.has(c.id)) { ids.add(c.id); grew = true; } }); }
      return ids;
    }
    const catHasProducts = id => { const ids = catWithSubs(id); return products.some(p => ids.has(p.category_id)); };
    function catTrail(id) {   // [main, …, id]
      const out = []; let c = categories.find(x => x.id === id), n = 0;
      while (c && n++ < 20) { out.unshift(c); c = categories.find(x => x.id === c.parent_id); }
      return out;
    }
    function renderCats() {
      const trail = catTrail(activeCat), root = trail[0];
      const roots = catKids(null).filter(c => catHasProducts(c.id));   // only categories that have products
      $("catBar").classList.toggle("hidden", !roots.length);
      $("cats").innerHTML = roots.length ? `<button class="btn ${!activeCat ? "active" : ""}" data-cat="">All</button>` +
        roots.map(c => `<button class="btn ${root && root.id === c.id ? "active" : ""}" data-cat="${c.id}">${esc(c.name)}</button>`).join("") : "";
      // the chosen main category's sub-categories (and their sub-categories) in the side panel
      const kids = root ? catKids(root.id).filter(k => catHasProducts(k.id)) : [];
      const tree = list => `<ul>${list.map(c => {
        const cls = c.id === activeCat ? "on" : trail.some(t => t.id === c.id) ? "in-path" : "";
        return `<li><button type="button" class="${cls}" data-cat="${c.id}">${esc(c.name)}</button></li>`;   // only this level — the next level shows as photo tiles
      }).join("")}</ul>`;
      const sn = $("subNav");
      sn.classList.toggle("hidden", !kids.length);
      sn.innerHTML = kids.length ? `<h3><span>${esc(root.name)}</span><button class="x" type="button" data-subclose="1" aria-label="Close">✕</button></h3>
        <ul><li><button type="button" class="${activeCat === root.id ? "on" : ""}" data-cat="${root.id}">All ${esc(root.name)}</button></li></ul>${tree(kids)}` : "";
      const label = trail.slice(1).map(c => c.name).join(" › ");
      $("subNavOpen").classList.toggle("hidden", !kids.length);
      $("subNavOpen").innerHTML = kids.length ? `☰ ${esc(root.name)}${label ? " › " + esc(label) : " — choose a category"}` : "";
      if (!kids.length) toggleSubNav(false);
      // phones: rows of buttons — sub-categories, then the sub-sub-categories of the one picked
      // phones: a narrow side panel next to the tiles with the same list as the computer's sidebar
      $("subChips").innerHTML = kids.length ? `<div class="ps-title">${esc(root.name)}</div>` +
        `<button type="button" class="${activeCat === root.id ? "on" : ""}" data-cat="${root.id}">All ${esc(root.name)}</button>` +
        kids.map(c => `<button type="button" class="${c.id === activeCat ? "on" : trail.some(t => t.id === c.id) ? "in-path" : ""}" data-cat="${c.id}">${esc(c.name)}</button>`).join("") : "";
      document.querySelector(".shop-content").classList.toggle("has-side", kids.length > 0);
      renderTiles(trail);
      setTimeout(updateCatArrows, 0);
    }
    // photo tiles for the categories inside the chosen one (the picture comes from a product in that category)
    function catImage(id) {
      const ids = catWithSubs(id);
      for (const p of products) {
        if (!ids.has(p.category_id)) continue;
        const img = p.image_url || (colors.find(c => c.product_id === p.id && c.image_url) || {}).image_url;
        if (img) return img;
      }
      return "";
    }
    function renderTiles(trail) {
      const box = $("catTiles"), cur = trail[trail.length - 1];
      if (!cur) {   // "All": the 20 newest products as photo tiles (products are loaded newest first)
        const q = $("search").value.trim();
        const newest = products.slice(0, 20);
        if (q || !newest.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
        box.classList.remove("hidden");
        box.innerHTML = `<h2>New In</h2><div class="tile-grid">` + newest.map(p => {
          const o = optionsOf(p), img = p.image_url || (o.colors.find(c => c.image_url) || {}).image_url || "";
          return `<button type="button" class="tile" data-open="${p.id}">
            <span class="ph">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}</span>
            <span class="nm">${esc(p.name)}</span></button>`;
        }).join("") + `</div>`;
        return;
      }
      let parent = cur, list = catKids(cur.id).filter(k => catHasProducts(k.id));
      // the last level has no categories inside it: keep showing it with its neighbours
      if (!list.length && trail.length > 2) { parent = trail[trail.length - 2]; list = catKids(parent.id).filter(k => catHasProducts(k.id)); }
      if (!list.length || trail.length < 2 && !list.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
      box.classList.remove("hidden");
      box.innerHTML = `<h2>Shop ${esc(parent.name)}</h2><div class="tile-grid">` + list.map(c => {
        const img = catImage(c.id);
        return `<button type="button" class="tile ${c.id === activeCat ? "on" : ""}" data-cat="${c.id}">
          <span class="ph">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ""}</span><span class="nm">${esc(c.name)}</span></button>`;
      }).join("") + `</div>`;
    }
    function toggleSubNav(open) {
      $("subNav").classList.toggle("open", open);
      $("subNavBack").classList.toggle("open", open);
    }
    const isPhone = () => window.matchMedia("(max-width: 760px)").matches;
    // ‹ › buttons scroll the main categories; greyed out at either end
    function updateCatArrows() {
      const el = $("cats"), over = el.scrollWidth > el.clientWidth + 2;
      $("catBar").classList.toggle("no-overflow", !over);
      $("catLeft").disabled = el.scrollLeft <= 2;
      $("catRight").disabled = el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
    }
    $("catLeft").onclick = () => $("cats").scrollBy({ left: -$("cats").clientWidth * .7 });
    $("catRight").onclick = () => $("cats").scrollBy({ left: $("cats").clientWidth * .7 });
    $("cats").addEventListener("scroll", updateCatArrows, { passive: true });
    window.addEventListener("resize", updateCatArrows);
    $("subNavOpen").onclick = () => toggleSubNav(true);
    $("subNavBack").onclick = () => toggleSubNav(false);

    function renderProducts() {
      const q = $("search").value.trim().toLowerCase();
      // a category that has sub-categories shows only their photo tiles (plus any products placed directly in it);
      // the products appear once you open the last level, e.g. Women › Footwear › Vellies. A search looks everywhere.
      const hasSubs = activeCat && catKids(activeCat).some(k => catHasProducts(k.id));
      const allTiles = !activeCat && !q && products.length > 0;   // "All" shows the New In tiles instead
      renderTiles(catTrail(activeCat));
      if (allTiles) { $("products").innerHTML = ""; $("empty").classList.add("hidden"); return; }
      const catSet = !activeCat ? null : hasSubs && !q ? new Set([activeCat]) : catWithSubs(activeCat);
      const list = products.filter(p =>
        (!catSet || catSet.has(p.category_id)) &&
        (!q || p.name.toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q) ||
               (p.full_description || "").toLowerCase().includes(q) ||
               colors.some(c => c.product_id === p.id && c.name.toLowerCase().includes(q))));
      $("empty").classList.toggle("hidden", list.length > 0 || (hasSubs && !q));
      $("products").innerHTML = list.map(cardHtml).join("");
    }
    // the card in the grid: picture, name, short description and price — click it for everything else
    function priceInfo(p, o) {
      if (!o.colors.length) return { html: priceHtml(p, p.price, "price") };
      // cheapest colour after any discount; red when that colour is on sale
      const ps = o.colors.map(c => ({ c, full: Number(c.price != null ? c.price : p.price) }))
        .map(x => ({ ...x, now: salePrice(p, x.full, x.c) }));
      const best = ps.reduce((a, b) => b.now < a.now ? b : a);
      const varies = ps.some(x => x.now !== best.now);
      return { html: priceHtml(p, best.full, "price", varies ? "From " : "", best.c) };
    }
    function cardHtml(p) {
      const o = optionsOf(p);
      const total = o.has ? o.variants.reduce((t, x) => t + x.stock, 0) : p.stock;
      const img = p.image_url || (o.colors.find(x => x.image_url) || {}).image_url || "";
      return `
        <div class="card pcard" data-open="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)} — view details">
          <div class="pimg"><img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.visibility='hidden'" />
            <button type="button" class="heart ${wish.has(p.id) ? "on" : ""}" data-wish="${p.id}" title="Save to wishlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg></button>
            ${total > 0 ? "" : `<span class="soldout">Sold out</span>`}${anySale(p) && total > 0 ? `<span class="soldout sale-badge">-${Number(p.discount_pct)}%</span>` : ""}</div>
          <div class="body">
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.description || "")}</p>
            <div class="price-row">${priceInfo(p, o).html}
              ${o.colors.length > 1 ? `<span class="muted" style="font-size:12px">${o.colors.length} colours</span>` : ""}</div>
            ${anySale(p) ? `<div class="sale-note">${saleNote(p, null, o.colors.length && o.colors.some(c => !discountNow(p, c)))}</div>` : ""}
          </div>
        </div>`;
    }

    // ---------- PRODUCT WINDOW: picture, colours, sizes (with stock), price, Add to cart, Full details ----------
    let openPid = null, showFull = false;
    function openProduct(pid) {
      openPid = pid; showFull = false;
      renderDetail();
      $("pmodal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
      $("pmodal").querySelector(".pm-close").focus();
    }
    function closeProduct() {
      openPid = null;
      $("pmodal").classList.add("hidden");
      document.body.style.overflow = "";
    }
    function renderDetail() {
      const p = products.find(x => x.id === openPid);
      if (!p) return closeProduct();
      const o = optionsOf(p);
      let html;
      if (!o.has) {
        html = detailHtml(p, o, { img: p.image_url, price: p.price, stockText: p.stock > 0 ? p.stock + " in stock" : "Sold out", canAdd: p.stock > 0,
          notify: p.stock > 0 ? null : { variant: null, what: p.name } });
      } else {
        const c = choice(p, o), col = o.colors.find(x => x.id === c.color);
        const v = variantFor(p, o, c);
        const total = o.variants.reduce((t, x) => t + x.stock, 0);
        const needSize = o.sizes.length > 1 && !c.size;
        // sold out (the whole product, or the colour + size chosen): offer "notify me"
        const selOut = !needSize && (!v || v.stock === 0);
        const notify = total === 0 || selOut
          ? { variant: selOut && v ? v.id : null, what: [p.name, col && col.name, !needSize && c.size && "size " + c.size].filter(Boolean).join(", ") } : null;
        html = detailHtml(p, o, {
          notify,
          c, col,
          img: (col && col.image_url) || p.image_url || (o.colors.find(x => x.image_url) || {}).image_url || "",
          price: col && col.price != null ? col.price : p.price,
          stockText: total === 0 || selOut ? "Sold out" : needSize ? "Please choose a size" : v ? v.stock + " in stock" : "",
          canAdd: total > 0 && !selOut,
          sizeStock: sz => o.variants.filter(x => x.size === sz && (!o.colors.length || x.color_id === c.color)).reduce((t, x) => t + x.stock, 0),
        });
      }
      $("pmBody").innerHTML = html;
    }
    function detailHtml(p, o, d) {
      const full = (p.full_description || "").trim();
      const img = `<div class="pm-img"><img src="${esc(d.img || "")}" alt="${esc(p.name + (d.col ? " – " + d.col.name : ""))}" onerror="this.style.visibility='hidden'" /></div>`;
      // "Full details" view: the right side shows only the descriptions; ✕ (or Esc) returns to the options
      if (full && showFull) return img + `
        <div class="pm-info">
          <h2 id="pmTitle">${esc(p.name)}</h2>
          ${p.description ? `<p class="pm-desc">${esc(p.description)}</p>` : ""}
          <div class="pm-full"><h3>Full details</h3><div>${esc(full)}</div></div>
        </div>`;
      return `
        <div class="pm-img"><img src="${esc(d.img || "")}" alt="${esc(p.name + (d.col ? " – " + d.col.name : ""))}" onerror="this.style.visibility='hidden'" /></div>
        <div class="pm-info">
          <button type="button" class="heart ${wish.has(p.id) ? "on" : ""}" data-wish="${p.id}" title="${wish.has(p.id) ? "Remove from wishlist" : "Save to wishlist"}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg></button>
          <h2 id="pmTitle">${esc(p.name)}</h2>
          ${p.description ? `<p class="pm-desc">${esc(p.description)}</p>` : ""}
          ${o.colors.length ? `
            <div class="pm-label">Colour: <strong>${esc(d.col ? d.col.name : "")}</strong></div>
            <div class="swatches pm-swatches">${o.colors.map(x => `
              <button type="button" class="swatch ${d.col && x.id === d.col.id ? "on" : ""} ${colorStock(o, x.id) ? "" : "out"} ${discountNow(p, x) ? "has-sale" : ""}"
                data-pcol="${p.id}|${x.id}" title="${esc(x.name)}${discountNow(p, x) ? ` — ${discountNow(p, x)}% off` : ""}${colorStock(o, x.id) ? "" : " — sold out"}">
                ${x.image_url ? `<img src="${esc(x.image_url)}" alt="${esc(x.name)}">` : `<span>${esc(x.name.slice(0, 2))}</span>`}
              </button>`).join("")}</div>` : ""}
          ${o.sizes.length ? `
            <div class="pm-label">Size${d.c && d.c.size ? `: <strong>${esc(d.c.size)}</strong>` : ""}</div>
            <div class="pm-sizes">${o.sizes.map(sz => { const n = d.sizeStock(sz); return `
              <button type="button" class="pm-size ${d.c.size === sz ? "on" : ""} ${n ? "" : "out"}" data-psize="${p.id}|${esc(sz)}"
                title="${n ? n + " in stock" : "Sold out — choose it to be told when it's back"}">${esc(sz)}<span class="cnt ${n ? "" : "zero"}">${n}</span></button>`; }).join("")}</div>` : ""}
          ${d.notify ? notifyHtml(p, d.notify) : ""}
          <div class="pm-buy">
          <div class="pm-price-row">
            <span>${priceHtml(p, d.price, "pm-price", "", d.col)}${discountNow(p, d.col) ? `<div class="sale-note">${saleNote(p, d.col)}</div>` : ""}</span>
            <span class="muted" style="font-size:13px">${esc(d.stockText || "")}</span>
          </div>
          <div class="pm-actions">
            <button class="btn primary" data-add="${p.id}" ${d.canAdd ? "" : "disabled"}>Add to cart</button>
            ${full ? `<button class="btn" type="button" data-full="1">Full details</button>` : ""}
          </div>
          </div>
        </div>`;
    }

    // ---------- CART ----------
    function addToCart(pid) {
      const p = products.find(x => x.id === pid), o = optionsOf(p);
      let key = pid;
      if (o.has) {
        const c = choice(p, o);
        if (o.sizes.length > 1 && !c.size) return toast("Please choose a size");
        const v = variantFor(p, o, c);
        if (!v || v.stock <= 0) return toast("That colour/size is sold out");
        key = v.id;
      }
      addKey(key, true);
    }
    function addKey(key, announce) {
      const L = lineInfo(key); if (!L) return;
      const current = cart[key] || 0;
      if (current >= L.stock) { toast("No more stock available"); return; }
      cart[key] = current + 1;
      saveCart();
      if (announce) toast(`${L.name}${L.sub ? " (" + L.sub + ")" : ""} added to cart`);
    }

    function shippingFor(subtotal) {
      const fee = Number(settings.shipping_fee) || 0, free = Number(settings.free_shipping_from) || 0;
      return fee > 0 && !(free > 0 && subtotal >= free) ? fee : 0;
    }
    function renderCart() {
      const keys = Object.keys(cart).filter(k => lineInfo(k));
      let total = 0, count = 0;
      $("cartLines").innerHTML = keys.length ? keys.map(k => {
        const L = lineInfo(k), qty = cart[k];
        total += L.price * qty; count += qty;
        return `<div class="line">
          ${L.image ? `<img src="${esc(L.image)}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px;flex:none">` : ""}
          <div style="flex:1;min-width:0"><div>${esc(L.name)}</div>
            ${L.sub ? `<div class="muted" style="font-size:12px">${esc(L.sub)}</div>` : ""}
            <div class="muted" style="font-size:13px">${money(L.price)}</div></div>
          <div class="qty">
            <button class="btn" data-dec="${k}">−</button><span>${qty}</span>
            <button class="btn" data-inc="${k}">+</button>
          </div></div>`;
      }).join("") : '<p class="muted">Your cart is empty.</p>';
      // shipping: Settings > Courier & Shipping Fees (the server works it out the same way when the order is placed)
      const ship = shippingFor(total), fee = Number(settings.shipping_fee) || 0, free = Number(settings.free_shipping_from) || 0;
      const showShip = count > 0 && fee > 0;
      document.querySelector("#cartSums .sum-sub").classList.toggle("hidden", !showShip);
      document.querySelector("#cartSums .sum-ship").classList.toggle("hidden", !showShip);
      $("cartSub").textContent = money(total);
      $("cartShip").innerHTML = ship === 0 ? `<strong style="color:var(--accent)">Free</strong>` : money(ship);
      const note = !showShip || !free ? "" : ship === 0 ? "🎉 You qualify for free shipping!"
        : `Add ${money(free - total)} more for free shipping (orders of ${money(free)}+).`;
      $("shipNote").textContent = note; $("shipNote").classList.toggle("hidden", !note);
      $("cartCount").textContent = count;
      $("cartTotal").textContent = money(total + (count ? ship : 0));
      $("checkoutBtn").disabled = count === 0;
    }

    function openCart(open) {
      $("cart").classList.toggle("open", open);
      $("overlay").classList.toggle("show", open);
      if (!open) {
        $("checkout").classList.add("hidden");
        $("checkoutBtn").textContent = "Checkout";
        $("cartView").classList.remove("hidden");
        $("doneView").classList.add("hidden");
        $("cartSums").classList.remove("hidden");
        $("checkoutBtn").classList.remove("hidden");
        $("closeCart").textContent = "Continue shopping";
        $("drawerTitle").textContent = "Your cart";
      }
    }

    function showOrderDone(ref, total, email) {
      const s = settings;
      const hasBank = s.bank_name || s.account_number;
      const row = (k, v) => v ? `<div><span class="muted">${k}</span><strong>${esc(v)}</strong></div>` : "";
      $("doneView").innerHTML = `
        <h3 style="margin-top:0">Thank you for your order!</h3>
        <p>Your order number is <strong>${ref}</strong>. We'll be in touch at ${esc(email)}.</p>
        <p>Amount due: <strong>${money(total)}</strong></p>
        <p class="muted" style="font-size:13px">${customer ? "You can follow this order any time under <b>My account → My orders</b>."
          : `Follow your order any time with <b>Track order</b> at the top — you'll need the order number and your email.`}</p>
        ${hasBank ? `
          <h4 style="margin:16px 0 6px">Pay by EFT</h4>
          <div class="eft">
            ${row("Bank", s.bank_name)}${row("Account holder", s.account_name)}
            ${row("Account number", s.account_number)}${row("Branch code", s.branch_code)}
            ${row("Account type", s.account_type)}${row("Reference", ref)}
          </div>` : ""}
        ${s.payment_note ? `<p class="muted" style="font-size:14px;white-space:pre-line">${esc(s.payment_note)}</p>` : ""}`;
      $("cartView").classList.add("hidden");
      $("doneView").classList.remove("hidden");
      $("cartSums").classList.add("hidden");
      $("checkoutBtn").classList.add("hidden");
      $("closeCart").textContent = "Back to shop";
      $("drawerTitle").textContent = "Order placed";
    }

    async function placeOrder() {
      const form = $("checkout");
      if (form.classList.contains("hidden")) {
        form.classList.remove("hidden");
        fillCheckout();
        $("checkoutBtn").textContent = "Place order";
        form.querySelector("input").focus();
        return;
      }
      if (!form.reportValidity()) return;
      const f = Object.fromEntries(new FormData(form));
      const lines = Object.entries(cart).map(([key, qty]) => ({ L: lineInfo(key), key, qty })).filter(x => x.L);
      const items = lines.map(({ L, key, qty }) => L.variant ? { id: L.product.id, variant_id: key, qty } : { id: key, qty });
      const sub = lines.reduce((t, x) => t + x.L.price * x.qty, 0);
      const total = sub + shippingFor(sub);
      $("checkoutBtn").disabled = true;
      // signed in: place it through the customer's account so it's linked to them
      const { data, error } = await (customer ? acct : db).rpc("place_order", { p_customer: f, p_items: items });
      $("checkoutBtn").disabled = false;
      if (error) { toast(error.message); return; }
      const ref = String(data).slice(0, 8).toUpperCase();
      cart = {}; saveCart(); form.reset();
      if (customer && (!customer.profile.phone && f.phone || !customer.profile.address && f.address)) {   // remember for next time
        const upd = {}; if (!customer.profile.phone && f.phone) upd.phone = f.phone; if (!customer.profile.address && f.address) upd.address = f.address;
        acct.from("customers").update(upd).eq("id", customer.user.id).then(() => Object.assign(customer.profile, upd));
      }
      showOrderDone(ref, total, f.email);
      loadCatalog();
    }

    // =====================================================
    // CUSTOMER ACCOUNTS — sign in, my orders, wishlist, my details
    // =====================================================
    let customer = null;          // { user, profile } when signed in
    let wish = new Set();         // product ids in the wishlist
    let accView = "signin", accMsg = "", accTab = "orders", accAfter = null;
    const notified = new Set();   // "notify me" sent this visit (product|variant)

    async function refreshCustomer() {
      const { data: { session } } = await acct.auth.getSession();
      if (!session) { customer = null; wish = new Set(); updateAccHeader(); return; }
      let { data: prof } = await acct.from("customers").select("*").eq("id", session.user.id).maybeSingle();
      if (!prof) {   // account made before customer accounts existed
        await acct.from("customers").insert({ id: session.user.id, email: session.user.email });
        prof = { id: session.user.id, email: session.user.email };
      }
      customer = { user: session.user, profile: prof };
      const w = await acct.from("wishlist").select("product_id");
      wish = new Set((w.data || []).map(r => r.product_id));
      updateAccHeader();
    }
    function updateAccHeader() {
      // signed in: "Hi Jane" next to the account icon (also on phones), so it's clear you're logged in
      const first = customer ? String(customer.profile.name || "").trim().split(/\s+/)[0] : "";
      $("accLabel").textContent = customer ? (first ? "Hi " + first : "My account") : "Sign in";
      $("accBtn").classList.toggle("signed", !!customer);
      $("accBtn").title = customer ? `Signed in as ${customer.user.email} — my account` : "Sign in";
      $("wishCount").textContent = wish.size; $("wishCount").classList.toggle("hidden", !wish.size);
      if (products.length) { renderProducts(); if (openPid) renderDetail(); }
    }
    function openAccount(view, msg, after) {
      accView = view || (customer ? "account" : "signin"); accMsg = msg || ""; accAfter = after || null;
      renderAccount();
      $("accModal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
      setTimeout(() => { const i = $("accBody").querySelector("input:not([readonly])"); if (i) i.focus(); }, 30);
    }
    function closeAccount() { $("accModal").classList.add("hidden"); if (!openPid) document.body.style.overflow = ""; }
    const friendly = m => /Invalid login credentials/i.test(m) ? "Wrong email or password."
      : /already registered|already been registered/i.test(m) ? "There's already an account with this email — please sign in."
      : /Email not confirmed/i.test(m) ? "Please confirm your email first — check your inbox for the link."
      : /Password should be at least/i.test(m) ? "Your password must be at least 6 characters."
      : /rate limit/i.test(m) ? "Too many tries — please wait a few minutes and try again." : m;

    function renderAccount() {
      const b = $("accBody"), note = accMsg ? `<div class="note">${esc(accMsg)}</div>` : "";
      if (accView === "signin") b.innerHTML = `
        <h2 id="accTitle">Sign in</h2><p class="lead">Welcome back! Sign in to see your orders and wishlist.</p>${note}
        <form data-accform="signin">
          <label>Email</label><input name="email" type="email" required autocomplete="email" />
          <label>Password</label><input name="password" type="password" required autocomplete="current-password" />
          <div class="err"></div>
          <button class="btn primary wide">Sign in</button>
        </form>
        <div class="links"><button class="linkbtn" data-accgo="forgot">Forgot your password?</button><span>New here? <button class="linkbtn" data-accgo="signup">Create an account</button></span></div>`;
      else if (accView === "signup") b.innerHTML = `
        <h2 id="accTitle">Create an account</h2><p class="lead">Save your details for faster checkout, follow your orders and keep a wishlist.</p>${note}
        <form data-accform="signup">
          <label>Full name</label><input name="name" required autocomplete="name" />
          <label>Email</label><input name="email" type="email" required autocomplete="email" />
          <label>Phone</label><input name="phone" type="tel" autocomplete="tel" />
          <label>Password <span class="muted" style="font-size:12px">(at least 8 characters)</span></label><input name="password" type="password" minlength="8" required autocomplete="new-password" />
          <div class="err"></div>
          <button class="btn primary wide">Create account</button>
        </form>
        <div class="links"><span>Already have an account? <button class="linkbtn" data-accgo="signin">Sign in</button></span></div>`;
      else if (accView === "forgot") b.innerHTML = `
        <h2 id="accTitle">Forgot your password?</h2><p class="lead">Enter your email and we'll send you a link to choose a new one.</p>${note}
        <form data-accform="forgot"><label>Email</label><input name="email" type="email" required /><div class="err"></div>
          <button class="btn primary wide">Send the link</button></form>
        <div class="links"><button class="linkbtn" data-accgo="signin">Back to sign in</button></div>`;
      else if (accView === "reset") b.innerHTML = `
        <h2 id="accTitle">Choose a new password</h2>${note}
        <form data-accform="reset"><label>New password <span class="muted" style="font-size:12px">(at least 8 characters)</span></label>
          <input name="password" type="password" minlength="8" required autocomplete="new-password" /><div class="err"></div>
          <button class="btn primary wide">Save new password</button></form>`;
      else if (accView === "track") b.innerHTML = `
        <h2 id="accTitle">Track my order</h2><p class="lead">Enter your order number (on your order email, e.g. <b>A1B2C3D4</b>) and the email you ordered with.</p>
        <form data-accform="track">
          <label>Order number</label><input name="ref" required maxlength="9" placeholder="A1B2C3D4" style="text-transform:uppercase" />
          <label>Email</label><input name="email" type="email" required value="${esc(customer ? customer.user.email : "")}" />
          <div class="err"></div><button class="btn primary wide">Track order</button>
        </form><div id="trackOut" style="margin-top:16px"></div>`;
      else {   // signed in
        const tabs = [["orders", "My orders"], ["wishlist", `Wishlist (${wish.size})`], ["details", "My details"]];
        b.innerHTML = `
          <h2 id="accTitle">Hi ${esc((customer.profile.name || "there").split(" ")[0])}!</h2>
          <p class="lead">${esc(customer.user.email)} · <button class="linkbtn" data-accout="1">Sign out</button></p>${note}
          <div class="acc-tabs">${tabs.map(([k, l]) => `<button type="button" class="${accTab === k ? "on" : ""}" data-acctab="${k}">${l}</button>`).join("")}</div>
          <div id="accPane"></div>`;
        renderAccPane();
      }
    }
    async function renderAccPane() {
      const pane = $("accPane"); if (!pane) return;
      if (accTab === "orders") {
        pane.innerHTML = `<p class="muted">Loading your orders…</p>`;
        const { data, error } = await acct.rpc("my_orders");
        if (accTab !== "orders" || !$("accPane")) return;
        pane.innerHTML = error ? `<p class="err">${esc(error.message)}</p>`
          : (data || []).length ? data.map(orderHtml).join("") : `<p class="muted">No orders yet. Orders you place while signed in show here.</p>`;
      } else if (accTab === "wishlist") {
        const list = products.filter(p => wish.has(p.id));
        pane.innerHTML = list.length ? `<div class="wish-grid">${list.map(p => {
          const o = optionsOf(p), img = p.image_url || (o.colors.find(c => c.image_url) || {}).image_url || "";
          return `<div class="wish-item" data-wishopen="${p.id}">
            <div class="ph">${img ? `<img src="${esc(img)}" alt="">` : ""}</div>
            <div class="nm">${esc(p.name)}</div><div class="pr">${priceInfo(p, o).html}</div>
            <button type="button" class="linkbtn" style="font-size:12px" data-wish="${p.id}">Remove</button></div>`; }).join("")}</div>`
          : `<p class="muted">Your wishlist is empty. Tap the ♡ on any product to save it here.</p>`;
      } else {
        const pr = customer.profile;
        pane.innerHTML = `<form data-accform="details">
          <label>Full name</label><input name="name" value="${esc(pr.name || "")}" required />
          <label>Email</label><input value="${esc(customer.user.email)}" readonly style="opacity:.7" />
          <label>Phone</label><input name="phone" type="tel" value="${esc(pr.phone || "")}" />
          <label>Delivery address</label><textarea name="address" rows="3">${esc(pr.address || "")}</textarea>
          <div class="err"></div><button class="btn primary wide">Save my details</button>
        </form>
        <form data-accform="password" style="margin-top:22px;border-top:1px solid var(--border);padding-top:6px">
          <label>New password <span class="muted" style="font-size:12px">(at least 8 characters)</span></label>
          <input name="password" type="password" minlength="8" required autocomplete="new-password" />
          <div class="err"></div><button class="btn wide" style="width:100%;margin-top:10px">Change password</button>
        </form>`;
      }
    }
    // one order: number, date, status, progress, courier + waybill, items
    function orderHtml(o) {
      const d = x => x ? new Date(x).toLocaleDateString(cfg.LOCALE, { day: "numeric", month: "short" }) : "";
      const cancelled = o.status === "cancelled";
      const order = ["new", "invoiced", "paid", "shipped", "completed"], at = order.indexOf(o.status);
      const steps = [["Placed", o.created_at], ["Invoiced", o.invoiced_at], ["Paid", o.paid_at], ["Shipped", o.shipped_at || o.ship_date], ["Delivered", o.completed_at]];
      const label = { new: "Order received", invoiced: "Invoiced", paid: "Paid", shipped: "On its way", completed: "Completed", cancelled: "Cancelled" }[o.status] || o.status;
      return `<div class="ord">
        <div class="ord-top"><div><div class="ref">Order #${esc(o.ref)}</div><div class="dt">${new Date(o.created_at).toLocaleString(cfg.LOCALE, { dateStyle: "medium", timeStyle: "short" })}</div></div>
          <span class="pill ${esc(o.status)}">${esc(label)}</span></div>
        ${cancelled ? "" : `<div class="steps">${steps.map((st, i) => `<div class="st ${i <= at ? "done" : ""}"><i></i>${st[0]}<br>${i <= at ? d(st[1]) : ""}</div>`).join("")}</div>`}
        ${o.waybill_no || o.courier_name ? `<div class="ship-box">🚚 ${esc(o.courier_name || "Courier")}${o.ship_date ? ` · shipped ${d(o.ship_date + "T12:00")}` : ""}${o.waybill_no ? `<br>Waybill number: <b>${esc(o.waybill_no)}</b>` : ""}</div>` : ""}
        <div class="ord-items">${(o.items || []).filter(i => !i.shipping).map(i => `${i.qty} × ${esc(i.name)}`).join("<br>")}</div>
        <div class="ord-total"><span>Total${Number(o.shipping_fee) ? ` <span class="muted" style="font-weight:400;font-size:12px">(incl. ${money(o.shipping_fee)} shipping)</span>` : ""}</span><span>${money(o.total)}</span></div>
      </div>`;
    }

    // forms in the account window
    document.addEventListener("submit", async e => {
      const f = e.target, kind = f.dataset.accform;
      if (!kind) return;
      e.preventDefault();
      const err = f.querySelector(".err"), btn = f.querySelector("button:not([type=button])"), old = btn.textContent;
      const v = n => (f[n] && f[n].value || "").trim();
      err.textContent = ""; btn.disabled = true; btn.textContent = "Please wait…";
      try {
        if (kind === "signin") {
          const { error } = await acct.auth.signInWithPassword({ email: v("email"), password: f.password.value });
          if (error) throw error;
          await refreshCustomer(); toast("Signed in"); afterAuth();
        } else if (kind === "signup") {
          const { data, error } = await acct.auth.signUp({ email: v("email"), password: f.password.value,
            options: { data: { name: v("name"), phone: v("phone") }, emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw new Error("already registered");
          if (!data.session) { accView = "signin"; accMsg = "Account created! We've emailed you a link — click it to confirm your email, then sign in."; renderAccount(); return; }
          await refreshCustomer(); toast("Welcome! Your account is ready"); afterAuth();
        } else if (kind === "forgot") {
          const { error } = await acct.auth.resetPasswordForEmail(v("email"), { redirectTo: location.origin + location.pathname });
          if (error) throw error;
          accView = "signin"; accMsg = "If there's an account with that email, we've sent a link to choose a new password."; renderAccount();
        } else if (kind === "reset" || kind === "password") {
          const { error } = await acct.auth.updateUser({ password: f.password.value });
          if (error) throw error;
          toast("Password saved"); if (kind === "reset") { await refreshCustomer(); accView = "account"; accMsg = ""; renderAccount(); } else f.reset();
        } else if (kind === "details") {
          const upd = { name: v("name"), phone: v("phone") || null, address: v("address") || null };
          const { error } = await acct.from("customers").update(upd).eq("id", customer.user.id);
          if (error) throw error;
          Object.assign(customer.profile, upd); updateAccHeader(); toast("Details saved");
        } else if (kind === "track") {
          const { data, error } = await acct.rpc("track_order", { p_ref: v("ref").replace("#", ""), p_email: v("email") });
          if (error) throw error;
          $("trackOut").innerHTML = data ? orderHtml(data) : `<p class="err">We couldn't find that order. Check the order number and use the same email you ordered with.</p>`;
        }
      } catch (ex) {
        err.textContent = friendly(ex.message || String(ex));
      } finally { btn.disabled = false; btn.textContent = old; }
    });
    function afterAuth() {
      const go = accAfter; accAfter = null;
      if (go) { closeAccount(); go(); } else { accView = "account"; accMsg = ""; renderAccount(); }
    }
    async function toggleWish(pid) {
      if (!customer) return openAccount("signin", "Sign in or create an account to save favourites ♡", () => toggleWish(pid));
      const on = wish.has(pid);
      if (on) wish.delete(pid); else wish.add(pid);
      updateAccHeader();
      const r = on ? await acct.from("wishlist").delete().eq("customer_id", customer.user.id).eq("product_id", pid)
                   : await acct.from("wishlist").insert({ customer_id: customer.user.id, product_id: pid });
      if (r.error) { if (on) wish.add(pid); else wish.delete(pid); updateAccHeader(); return toast(r.error.message); }
      toast(on ? "Removed from your wishlist" : "Saved to your wishlist ♡");
      if (!$("accModal").classList.contains("hidden") && accTab === "wishlist") renderAccount();
    }

    // "notify me when back in stock"
    function notifyHtml(p, n) {
      const key = p.id + "|" + (n.variant || "");
      if (notified.has(key)) return `<div class="notify"><div class="ok">✓ We'll email you as soon as it's back in stock.</div></div>`;
      return `<div class="notify"><div class="t">🔔 Sold out — want to know when it's back?</div>
        <div class="s">We'll email you once ${esc(n.what)} is back in stock.</div>
        <form data-notify="${p.id}|${n.variant || ""}"><input name="email" type="email" required placeholder="Your email" value="${esc(customer ? customer.user.email : "")}" />
          <button class="btn primary">Notify me</button></form></div>`;
    }
    document.addEventListener("submit", async e => {
      const f = e.target; if (!f.dataset.notify) return;
      e.preventDefault();
      const [pid, vid] = f.dataset.notify.split("|"), btn = f.querySelector("button");
      btn.disabled = true;
      const { error } = await acct.rpc("request_stock_alert", { p_product: pid, p_variant: vid || null, p_email: f.email.value.trim() });
      btn.disabled = false;
      if (error) return toast(/request_stock_alert/.test(error.message) ? "This isn't switched on yet" : error.message);
      notified.add(pid + "|" + vid); renderDetail(); toast("We'll let you know 🔔");
    });

    $("accBtn").onclick = () => openAccount(customer ? "account" : "signin");
    $("wishBtn").onclick = () => { accTab = "wishlist"; openAccount(customer ? "account" : "signin", customer ? "" : "Sign in to see your wishlist ♡"); };
    $("trackBtn").onclick = () => openAccount("track");
    $("accModal").addEventListener("click", async e => {
      if (e.target.id === "accModal" || e.target.closest(".acc-close")) return closeAccount();
      const t = e.target.closest("[data-accgo],[data-acctab],[data-accout],[data-wishopen]");
      if (!t) return;
      if (t.dataset.accgo) { accView = t.dataset.accgo; accMsg = ""; renderAccount(); }
      else if (t.dataset.acctab) { accTab = t.dataset.acctab; renderAccount(); }
      else if (t.dataset.accout) { await acct.auth.signOut(); customer = null; wish = new Set(); updateAccHeader(); closeAccount(); toast("Signed out"); }
      else if (t.dataset.wishopen && !e.target.closest("[data-wish]")) { closeAccount(); openProduct(t.dataset.wishopen); }
    });
    acct.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") setTimeout(() => openAccount("reset"), 300);
      if (event === "SIGNED_OUT") { customer = null; wish = new Set(); updateAccHeader(); }
    });

    // checkout: fill in a signed-in customer's details, or offer to sign in
    function fillCheckout() {
      const f = $("checkout");
      if (customer) {
        const pr = customer.profile;
        if (!f.name.value) f.name.value = pr.name || "";
        if (!f.email.value) f.email.value = customer.user.email || "";
        if (!f.phone.value) f.phone.value = pr.phone || "";
        if (!f.address.value) f.address.value = pr.address || "";
        $("coAcc").innerHTML = `Signed in as <b>${esc(customer.user.email)}</b> — this order will show under <i>My orders</i>.`;
      } else $("coAcc").innerHTML = `Have an account? <button type="button" class="linkbtn" id="coSignin">Sign in</button> to fill this in for you.`;
    }
    document.addEventListener("click", e => { if (e.target.id === "coSignin") openAccount("signin", "Sign in to fill in your details", () => { fillCheckout(); }); });

    // ---------- EVENTS ----------
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && !$("accModal").classList.contains("hidden")) { closeAccount(); return; }
      if (e.key === "Escape" && openPid) { if (showFull) { showFull = false; renderDetail(); } else closeProduct(); }
      const card = e.target.closest && e.target.closest("[data-open]");
      if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openProduct(card.dataset.open); }
    });
    document.addEventListener("change", e => {
      const s = e.target.closest("[data-psel]");
      if (s) { (sel[s.dataset.psel] = sel[s.dataset.psel] || {}).size = s.value; renderProducts(); }
    });
    document.addEventListener("click", e => {
      const d = e.target.dataset;
      const wb = e.target.closest("[data-wish]");
      if (wb) { e.stopPropagation(); toggleWish(wb.dataset.wish); return; }
      const t = e.target.closest("[data-pcol],[data-psize]");
      if (t && t.dataset.pcol) { const [pid, cid] = t.dataset.pcol.split("|"); (sel[pid] = sel[pid] || {}).color = cid; renderDetail(); return; }
      if (t && t.dataset.psize) { const [pid, sz] = t.dataset.psize.split("|"); (sel[pid] = sel[pid] || {}).size = sz; renderDetail(); return; }
      if (e.target.closest("[data-full]")) { showFull = !showFull; renderDetail(); $("pmodal").querySelector(".pm").scrollTop = 0; return; }
      // ✕ while reading the full details: one step back to the options; otherwise close
      if (e.target.closest(".pm-close")) { if (showFull) { showFull = false; renderDetail(); } else closeProduct(); return; }
      if (e.target.id === "pmodal") { closeProduct(); return; }
      const card = e.target.closest("[data-open]");
      if (card) { openProduct(card.dataset.open); return; }
      if (d.add) addToCart(d.add);
      if (d.inc) addKey(d.inc);
      if (d.dec) { cart[d.dec]--; if (cart[d.dec] <= 0) delete cart[d.dec]; saveCart(); }
      const cb = e.target.closest("[data-cat]");
      if (cb) {
        const id = cb.dataset.cat, fromMain = !!cb.closest("#cats"), c = categories.find(x => x.id === id);
        activeCat = id; renderCats(); renderProducts();
        // phones: picking a main category with sub-categories opens the side panel; picking in the panel closes it
        // (phones show the sub-categories as button rows instead of a side panel)
        if (fromMain) cb.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
      if (e.target.closest("[data-subclose]")) toggleSubNav(false);
    });
    $("search").addEventListener("input", renderProducts);
    $("cartBtn").onclick = () => openCart(true);
    $("closeCart").onclick = () => openCart(false);
    $("overlay").onclick = () => openCart(false);
    $("checkoutBtn").onclick = placeOrder;

    const SHOP_VERSION = "8.4";   // shown at the bottom of the shop, so you can see which version is live
    $("shopVersion").textContent = "Shop version " + SHOP_VERSION;
    // the admin's version, read from the live admin page so it's always right
    fetch("admin.html", { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(t => {
      const m = t.match(/APP_VERSION\s*=\s*"([^"]+)"/);
      if (m) $("shopVersion").textContent = `Shop version ${SHOP_VERSION} · Admin version ${m[1]}`;
    }).catch(() => {});
    loadSettings();
    loadCatalog().then(() => {   // a link like ?p=<product> opens that product (used in back-in-stock emails)
      const pid = new URLSearchParams(location.search).get("p");
      if (pid && products.some(x => x.id === pid)) openProduct(pid);
    });
    refreshCustomer();
  </script>
</body>
</html>
